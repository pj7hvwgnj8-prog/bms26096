<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Assignments</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <nav>
      <div class="logo">My<span>Assignments</span></div>
      <a href="#assignments">Assignments</a>
    </nav>
    <div class="hero-content">
      <p class="eyebrow">STUDENT DASHBOARD</p>
      <h1>My Assignments</h1>
      <p class="subtitle">A simple place to keep track of everything I need to submit.</p>
      <a class="button" href="#assignments">View assignments ↓</a>
    </div>
  </header>

  <main id="assignments">
    <section class="toolbar">
      <div>
        <p class="eyebrow">2026–27</p>
        <h2>Assignments</h2>
      </div>
      <div class="filters">
        <input id="search" type="search" placeholder="Search assignments..." />
        <select id="filter">
          <option value="all">All</option>
          <option value="upcoming">Upcoming</option>
          <option value="submitted">Submitted</option>
        </select>
      </div>
    </section>

    <section id="assignmentGrid" class="grid"></section>
  </main>

  <footer>
    <p>Updated whenever I update <strong>assignments.js</strong>.</p>
  </footer>

  <script src="assignments.js"></script>
  <script src="script.js"></script>
</body>
</html>
